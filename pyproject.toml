[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ai"
version = "0.1.0"
description = "A tiny ~10M-parameter decoder-only Transformer built and trained from scratch."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "tokenizers>=0.20,<1",
]
