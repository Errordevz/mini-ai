[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ai"
version = "0.2.0"
description = "Tiny Mini-AI training stack with a Qwen3.5 distillation and QLoRA path."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "tokenizers>=0.20,<1",
]
